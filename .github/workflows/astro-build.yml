name: AstroLauncher Build

# Builds ready-to-use AstroLauncher packages (with all developer features enabled)
# and uploads them as workflow artifacts. Download them from the run's "Artifacts" section.

on:
  push:
    branches:
    - AstroLauncher
  workflow_dispatch:

jobs:
  build-windows-bootstrap:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Publish bootstrap
      working-directory: SS14.Launcher.Bootstrap
      run: dotnet publish -r win-x64

    - uses: actions/upload-artifact@v4
      with:
        name: "bootstrap"
        retention-days: 1
        path: "SS14.Launcher.Bootstrap/bin/Release/net10.0-windows/win-x64/publish/Space Station 14 Launcher.exe"

  build:
    runs-on: ubuntu-latest
    needs: build-windows-bootstrap

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Create build (Linux)
      run: ./publish.py linux --x64-only

    - name: Download Windows Bootstrap
      uses: actions/download-artifact@v5
      with:
        name: "bootstrap"

    - name: Create build (Windows)
      run: ./publish.py windows --x64-only

    - name: Upload Windows build
      uses: actions/upload-artifact@v4
      with:
        name: AstroLauncher_Windows
        path: ./SS14.Launcher_Windows.zip

    - name: Upload Linux build
      uses: actions/upload-artifact@v4
      with:
        name: AstroLauncher_Linux
        path: ./SS14.Launcher_Linux.zip
